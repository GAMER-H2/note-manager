name: Build release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach assets to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x86_64)
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            artifact-name: note-manager-windows-x86_64
          - name: macOS (ARM64)
            os: macos-14
            rust-target: aarch64-apple-darwin
            artifact-name: note-manager-macos-arm64
          - name: Linux (x86_64)
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            artifact-name: note-manager-linux-x86_64
          - name: Linux (ARM64)
            os: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            artifact-name: note-manager-linux-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            rpm

      - name: Build desktop bundles
        run: npx tauri build --target ${{ matrix.rust-target }}

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.rpm

  build-android:
    name: Android (ARM64)
    runs-on: ubuntu-latest
    env:
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # When these three repository secrets are configured, Gradle signs the
      # APK and AAB. Without them, the workflow still builds unsigned files.
      - name: Configure Android release signing
        if: env.ANDROID_KEY_BASE64 != ''
        run: |
          echo "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/release.keystore"
          } > src-tauri/gen/android/keystore.properties

      - name: Build Android ARM64 APK and AAB
        run: npx tauri android build --target aarch64 --split-per-abi --apk --aab

      - name: Upload Android bundles
        uses: actions/upload-artifact@v4
        with:
          name: note-manager-android-arm64
          if-no-files-found: error
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

  publish-release-assets:
    name: Attach assets to release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: note-manager-*
          merge-multiple: true

      - name: Attach assets to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: release-assets/**/*
          fail_on_unmatched_files: true
