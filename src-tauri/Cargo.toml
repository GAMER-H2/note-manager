[package]
name = "note-manager"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "note_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Blocking HTTP on purpose: sync runs on Tauri's blocking command pool, and a
# blocking reqwest client panics if constructed inside a tokio context.
ureq = "2"
quick-xml = "0.37"
percent-encoding = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# The OS keychain has no Android backend; there, credentials fall back to the
# app-private data dir (see secrets.rs).
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
#tauri-plugin-notifications = "0.4.3"
